[workspace]
resolver = "2"
members = [
  "crates/honba-te-core",
  "crates/honba-te-auth",
  "crates/honba-te-zerodha",
  "crates/honba-te-upstox",
  "crates/honba-te-angelone",
  "crates/honba-te-router",
  "crates/honba-te-slicer",
  "crates/honba-te-audit",
]
default-members = []

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-te"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1.12"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }
sha2 = "0.11"
hex = "0.4"
parquet = { version = "53", features = ["arrow"] }
arrow = "53"
prometheus = { version = "0.13", features = ["process"] }
once_cell = "1"
opentelemetry = { version = "0.27", features = ["trace"] }
tracing-opentelemetry = "0.28"

honba-core      = { path = "../honba-core" }
honba-mon       = { path = "../honba-mon" }
honba-te-core   = { path = "crates/honba-te-core" }
honba-te-auth   = { path = "crates/honba-te-auth" }
schemars        = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1

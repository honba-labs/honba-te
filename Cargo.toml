[workspace]
resolver = "2"
members = [
  "crates/honba-te-core",
  "crates/honba-te-zerodha",
  "crates/honba-te-upstox",
  "crates/honba-te-angelone",
  "crates/honba-te-router",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/your-org/honba-te"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = "1"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }

honba-core          = { path = "../honba-core" }
honba-mon           = { path = "../honba-mon" }
honba-te-core       = { path = "crates/honba-te-core" }
honba-kokoro-types  = { path = "../honba-kokoro/crates/honba-kokoro-types" }
